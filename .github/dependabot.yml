version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # `open-pull-requests-limit: 0` turns off routine version bumps; security
  # updates ignore the limit and still open PRs. No `target-branch` here on
  # purpose: setting one would suppress security updates entirely, so these
  # land on the default branch.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
