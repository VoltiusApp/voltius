name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Pre-flight for the hash guard in publish-plugins.yml, which is the last line
  # of defence and stays where it is. That guard compares built bytes against
  # published bytes, so it needs a build and only runs deep inside a release —
  # after `tag` has already made the version tag immutable (issue #92). This job
  # answers the cheap proxy question instead (plugin source changed since its
  # published tag + manifest version unchanged) in seconds, on the PR.
  plugin-versions:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check reads the plugin-*-v* release tags, and a
      # shallow checkout has none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: node scripts/check-plugin-versions.mjs

  # Release builds on these OSes compile cfg(target_os) code that the Linux jobs never see,
  # and `pnpm build` spawns plugin builds differently on Windows; break here, not after the tag.
  platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm build

      # `pnpm build` exits 0 having built nothing if the plugin loop silently skips.
      - name: Assert all six plugin bundles were produced
        shell: pwsh
        run: |
          $ids = @('ssh-config','gist-sync','monitoring','docker','process-manager','proxmox')
          foreach ($id in $ids) {
            foreach ($f in @('index.js','manifest.json')) {
              $p = "src-tauri/resources/plugins/$id/$f"
              if (!(Test-Path $p)) { throw "missing $p" }
              if ((Get-Item $p).Length -eq 0) { throw "empty $p" }
            }
          }
          Write-Host "all six plugin bundles present"

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Cargo check
        run: cargo check --workspace

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/dotnet /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libsecret-1-dev openssh-sftp-server

      - run: pnpm install

      # Build the frontend first so `dist/` exists for the Tauri build script.
      - run: pnpm build

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Informational coverage on the modules under refactor — never blocks CI.
      - name: Coverage (informational)
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C "$HOME/.cargo/bin"
          cargo llvm-cov --workspace --summary-only
