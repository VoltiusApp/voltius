name: macos-keychain-probe

on:
  push:
    branches: [fix/macos-keychain-469]

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Clippy (macOS)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests
      - name: Bundle tests against the real login keychain
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib keychain_bundle -- --include-ignored
