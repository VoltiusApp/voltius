name: perf-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Voltius release tag to measure (or "latest")
        default: latest
      competitors:
        description: Also measure Reach, Termix, Tabby and Termius
        type: boolean
        default: false
      idle_seconds:
        description: Idle time before the last sample
        default: "90"

permissions:
  contents: read

jobs:
  idle:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/perf
      - name: Measure
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IDLE: ${{ inputs.idle_seconds }}
          COMPETITORS: ${{ inputs.competitors }}
        run: ./scripts/perf/windows-idle.ps1 -VoltiusTag $env:TAG -IdleSeconds ([int]$env:IDLE) -Competitors:($env:COMPETITORS -eq 'true')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-windows
          path: perf-out/
