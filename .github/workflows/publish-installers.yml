# Publishes the Homebrew cask (tap VoltiusApp/homebrew-voltius) and the winget
# manifest (microsoft/winget-pkgs) from a published GitHub release.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN   PAT with push access to VoltiusApp/homebrew-voltius
#   WINGET_PKGS_TOKEN    classic PAT (public_repo + workflow) for komac to fork
#                        winget-pkgs. Must be CLASSIC — winget-releaser does not
#                        support fine-grained PATs, which cannot authorize a PR
#                        against a repo the token owner does not own. `workflow`
#                        is required by the fast-forward step below.
name: publish-installers

on:
  # Called by tag-release.yml after a release is built and published. The
  # `release: published` event does NOT fire here on its own, because that
  # release is created by the default GITHUB_TOKEN and GitHub suppresses
  # workflow triggers from token-authored events (anti-recursion). This
  # workflow_call path is how new releases actually reach Homebrew/winget.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.4.0)'
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.4.0)'
        required: true
        type: string

concurrency:
  group: publish-installers
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${DISPATCH_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/Casks
          bash scripts/gen-homebrew-cask.sh "${{ steps.tag.outputs.tag }}" > out/Casks/voltius.rb
          cat out/Casks/voltius.rb

      - name: Audit cask
        # brew audit --online calls the GitHub API; without a token it uses the
        # unauthenticated 60 req/hr limit and flakes ("API rate limit exceeded")
        # on back-to-back runs. The default token lifts this to 5000/hr.
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew style out/Casks/voltius.rb
          brew tap-new voltiusapp/voltius --no-git
          mkdir -p "$(brew --repository voltiusapp/voltius)/Casks"
          cp out/Casks/voltius.rb "$(brew --repository voltiusapp/voltius)/Casks/voltius.rb"
          brew audit --cask --online voltiusapp/voltius/voltius

      - name: Push cask to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/VoltiusApp/homebrew-voltius" tap
          mkdir -p tap/Casks
          cp out/Casks/voltius.rb tap/Casks/voltius.rb
          cd tap
          if git diff --quiet; then
            echo "Cask already up to date for ${TAG}"; exit 0
          fi
          git config user.name 'voltius-bot'
          git config user.email 'bot@voltius.app'
          git add Casks/voltius.rb
          git commit -m "chore: update voltius cask to ${TAG}"
          git push origin HEAD:main

  winget:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${DISPATCH_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      # komac branches the fork from upstream, and once kipavy/winget-pkgs falls
      # behind microsoft/winget-pkgs it fails with "kipavy does not have the
      # correct permissions to execute `CreateRef`" — a misleading message that
      # has nothing to do with permissions. Upstream moves thousands of commits a
      # day, so the fork goes stale within about a day of not releasing; this is
      # what blocked v0.16.0 for four consecutive runs.
      #
      # merge-upstream is a plain fast-forward. It needs the token's `workflow`
      # scope WHENEVER the pending upstream diff touches .github/workflows/,
      # because the fast-forward then has to write a workflow file into the fork:
      # "refusing to allow a Personal Access Token to create or update workflow
      # ... without `workflow` scope". public_repo alone is enough the rest of
      # the time, which is why this is intermittent rather than permanent — it
      # first bit on 2026-08-05, when upstream added
      # manifest-validation-diagnosis.lock.yml half an hour before the v0.17.0
      # release ran.
      #
      # The refusal is a warning here, and surfaces one step later as komac's
      # misleading "does not have the correct permissions to execute CreateRef".
      # ALWAYS read this step's warning before believing that one. Manual
      # recovery, with a workflow-scoped token:
      #   gh api -X POST repos/kipavy/winget-pkgs/merge-upstream -f branch=master
      #   gh workflow run publish-installers.yml -f tag=vX.Y.Z
      - name: Fast-forward the winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          gh api -X POST repos/kipavy/winget-pkgs/merge-upstream \
            -f branch=master --jq '.message' || \
            echo "::warning::Could not fast-forward the fork; continuing."

      - name: Submit/update winget manifest
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Voltius.Voltius
          release-tag: ${{ steps.tag.outputs.tag }}
          installers-regex: '_(x64|arm64)-setup\.exe$'
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          # The winget-pkgs fork lives under the token account (kipavy), not
          # the org that owns this repo. Without this, komac defaults
          # KOMAC_FORK_OWNER to github.repository_owner (VoltiusApp) and fails
          # with "Could not resolve to a Repository VoltiusApp/winget-pkgs".
          fork-user: kipavy
