name: release-dry-run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: true
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
