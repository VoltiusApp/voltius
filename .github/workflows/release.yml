name: release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.51)'
        required: true
        type: string
    outputs:
      published:
        description: '"true" once the GitHub release itself is out of draft. Lets a caller run the distribution channels that only consume the published release even when an unrelated job here (e.g. publish-plugins) failed.'
        value: ${{ jobs.publish-release.outputs.published }}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.51)'
        required: true
        type: string

# Needed for the workflow_dispatch entry path, which doesn't inherit the
# caller's token. Overrides a "read" default_workflow_permissions so the
# release jobs can create/edit the GitHub release.
permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Extract release notes from CHANGELOG.md
        id: extract
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          notes=$(awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md)
          # Trim leading/trailing blank lines
          notes=$(printf '%s\n' "$notes" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for version $version. Add a '## [$version]' entry before releasing."
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            printf '%s\n' "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted release notes for $version:"
          printf '%s\n' "$notes"

  # Creates the draft release exactly once, and hands its id to every job that
  # uploads. Before this job existed, each publish-tauri job asked tauri-action
  # to "create or upload to" the tag: the action looks the release up by tag and
  # creates one when the lookup comes back empty. In 0.21.0 a transient TLS
  # failure on one runner made that lookup return nothing, so the job created a
  # SECOND release object on the same tag and the matrix split its uploads
  # across the two — the published release ended up with the Windows x64
  # bundles and the APK, the orphaned draft with macOS, Linux and Windows ARM.
  # A published release is immutable, so that is unrepairable: it cost a 0.21.1
  # recut. Handing out an id removes the lookup, and therefore the race.
  create-release:
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Create or reuse the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          # Reuses on a re-run; the lookup includes drafts, since the token has
          # write access.
          id=$(bash scripts/release-id.sh "$REPO" "$TAG")
          if [ -n "$id" ]; then
            echo "Reusing existing release $id for $TAG"
          else
            id=$(gh api -X POST "repos/$REPO/releases" \
              -f "tag_name=$TAG" \
              -f "name=Voltius $TAG" \
              -f "body=$NOTES" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
            echo "Created draft release $id for $TAG"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: [changelog, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Builds run concurrently. The shared-file race that forced serialization
      # is gone: each job turns the updater JSON off (below), so no job touches
      # latest.json. Per-platform installers + .sig files have unique names and
      # never collide. The updater-manifest job assembles latest.json once, after
      # all builds — single writer, no race.
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

          - platform: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
            args: ''

          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'

          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Read toolchain channel from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "channel=$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: '. -> target'

      - name: Install dependencies (Ubuntu native)
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev xdg-utils

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          # Fail the build rather than ship a binary with missing built-in plugins.
          # PROFILE=release already forces this; set explicitly so the guard survives
          # a switch to `tauri build --debug`, which bundles a real installer under
          # the debug profile where the assertion would otherwise be disabled.
          VOLTIUS_REQUIRE_SEEDED_PLUGINS: "1"
        with:
          # An id, not a tag: the action then uploads to exactly this release and
          # never looks one up or creates one. See the create-release job.
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          uploadPlainBinary: true
          updaterJsonPreferNsis: true
          # Don't write latest.json here — concurrent jobs would race on the
          # shared file. The .sig files still upload as bundle artifacts; the
          # updater-manifest job builds latest.json from them once all builds
          # finish. The input is named `includeUpdaterJson` in tauri-action v0
          # and `uploadUpdaterJson` in v1 — it must match the pinned major above,
          # or the action ignores it and defaults back to writing the file.
          uploadUpdaterJson: false

  # Experimental Android build — sideload APK, not Play Store. Release-signed
  # arm64-v8a only (covers ~all modern phones). tauri-action's `mobile: android`
  # input is unreleased (default branch only; not in @v0 or any tag), so we don't
  # rely on it — we set up the toolchain + signing, run `tauri android build`
  # directly, and upload the APK to the same draft release publish-tauri created.
  publish-android:
    # Only needs the draft to exist to upload into, which create-release now
    # guarantees — it used to wait on the whole publish-tauri matrix purely so
    # that some job had created the draft first.
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Read toolchain channel from rust-toolchain.toml
        id: rust
        run: echo "channel=$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voltius-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/voltius-release.keystore" >> "$GITHUB_ENV"

      # tauri-action@v1 does expose a `mobile` input, but this job predates it:
      # under the old v0 pin the input did not exist, so `mobile: android` was
      # ignored and the action ran `tauri build --apk`, which is only valid on
      # `tauri android build`. Building the signed APK directly still works and
      # has shipped every release, so it stays until someone tests the input.
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VOLTIUS_REQUIRE_SEEDED_PLUGINS: "1"
        run: pnpm tauri android build --apk --target aarch64

      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          src="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          dest="Voltius_${TAG#v}_aarch64.apk"
          cp "$src" "$dest"
          gh release upload "$TAG" "$dest" --clobber -R "$REPO"

  # Single-writer assembly of latest.json. Each build job skipped it
  # (uploadUpdaterJson:false) to avoid racing on the shared file; here we
  # download every .sig from the draft release and rebuild the manifest once,
  # reproducing exactly the key scheme tauri-action emits (bare default key per
  # OS + per-installer-type variants). Uploaded with --clobber.
  updater-manifest:
    needs: [changelog, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          mkdir -p sigs
          gh release download "$TAG" -R "$REPO" -p '*.sig' -D sigs
          python3 - <<'PY'
          import json, os, glob, datetime

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          notes = os.environ["NOTES"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"

          # Bare "{os}-{arch}" alias points at this installer type per OS.
          DEFAULT = {"linux": "appimage", "windows": "nsis", "darwin": "app"}

          def classify(name):
              if name.endswith(".AppImage"):
                  return "linux", ("x86_64" if "amd64" in name else "aarch64"), "appimage"
              if name.endswith(".deb"):
                  return "linux", ("x86_64" if "amd64" in name else "aarch64"), "deb"
              if name.endswith(".rpm"):
                  return "linux", ("x86_64" if "x86_64" in name else "aarch64"), "rpm"
              if name.endswith("-setup.exe"):
                  return "windows", ("x86_64" if "x64" in name else "aarch64"), "nsis"
              if name.endswith(".msi"):
                  return "windows", ("x86_64" if "x64" in name else "aarch64"), "msi"
              if name.endswith(".app.tar.gz"):
                  return "darwin", ("x86_64" if "x64" in name else "aarch64"), "app"
              return None

          platforms = {}
          for sig in sorted(glob.glob("sigs/*.sig")):
              asset = os.path.basename(sig)[:-4]  # strip .sig
              c = classify(asset)
              if not c:
                  continue
              o, arch, t = c
              with open(sig) as f:
                  entry = {"signature": f.read().strip(), "url": base + asset}
              platforms[f"{o}-{arch}-{t}"] = entry
              if DEFAULT[o] == t:
                  platforms[f"{o}-{arch}"] = entry

          if not platforms:
              raise SystemExit("No updater .sig files found — refusing to write empty latest.json")

          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .isoformat(timespec="milliseconds").replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$TAG" latest.json -R "$REPO" --clobber

  # Publishes the six first-party plugins (src/plugins/*) as their OWN GitHub
  # Releases, separate from the app release above — this is what lets a plugin fix
  # ship without cutting a full app release. The actual build/stage/hash-guard/
  # publish logic lives in publish-plugins.yml (also directly workflow_dispatch-able
  # for a plugin-only fix that doesn't need a full app release) so the two paths
  # can't drift apart. An app release always publishes all six, built from the app
  # tag, with each manifest's own minAppVersion (or a failure — see Task 3).
  publish-plugins:
    needs: [changelog, publish-tauri]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-plugins.yml
    with:
      ref: ${{ inputs.tag }}
      app_release: true
    secrets: inherit

  # The emitted plugins.json fragment is attached to the app release for the
  # record — merging it into voltiusApp/marketplace's plugins.json is a manual
  # follow-up this workflow cannot do (separate repo).
  attach-plugin-catalog:
    needs: publish-plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the catalogue fragment
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish-plugins.outputs.catalog-artifact }}
          path: dist

      - name: Attach the catalogue fragment to the app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/plugin-catalog.json -R "$REPO" --clobber

  # Types third-party plugin authors compile against. Deliberately has no needs:
  # the tag defines the API surface, so a failing installer job must not also
  # withhold the types package. Publish logic lives in publish-plugin-types.yml
  # (also directly workflow_dispatch-able, to publish without cutting a release).
  publish-plugin-types:
    uses: ./.github/workflows/publish-plugin-types.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
    secrets: inherit

  checksums:
    # attach-plugin-catalog is in here so its asset is hashed with the rest, and
    # so that publish-release — which needs checksums — cannot make the release
    # immutable before the catalogue is attached. Without that edge the two jobs
    # are siblings: a single pass happens to attach first, but a rerun does not,
    # and 0.22.0 lost plugin-catalog.json to `HTTP 422: Cannot upload assets to
    # an immutable release`.
    needs: [publish-tauri, publish-android, attach-plugin-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}"
          # Checksum only the distributable artifacts — skip signatures,
          # the updater manifest, and existing checksums.
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256|*.sig|latest.json) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          echo "=== Checksums ==="
          cat *.sha256
          gh release upload "${{ inputs.tag }}" *.sha256 -R "${{ github.repository }}" --clobber

  publish-release:
    needs: [checksums, updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Last point at which a split is still fixable: a draft can be edited and
      # its assets moved, a published release is immutable. Fail here rather
      # than publish half a release.
      - name: Refuse to publish a tag carrying more than one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release-id.sh "$REPO" "$TAG" --require > /dev/null

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" --draft=false --latest -R "${{ github.repository }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
