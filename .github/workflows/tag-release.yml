name: tag-release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

# Set at the workflow level so the token isn't capped by the repo's
# default_workflow_permissions. When that default is "read", per-job
# permissions can't elevate a reusable-workflow token past it, so the
# release job's create-release call fails with "Resource not accessible
# by integration". An explicit top-level block overrides the repo default.
permissions:
  contents: write

jobs:
  # ci runs this same check, but it triggers on the SAME push to main and nothing
  # makes tagging wait for it. A release cut by pushing straight to main could
  # therefore tag while the check is still running or already red — and the tag is
  # immutable, which is the whole problem #92 is about. Gating `tag` on it here is
  # what actually holds the "fail before the tag exists" property.
  plugin-versions:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check reads the plugin-*-v* release tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: node scripts/check-plugin-versions.mjs

  tag:
    needs: plugin-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "v=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")" >> $GITHUB_OUTPUT

      - name: Create tag if new version
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          TAG="v${{ steps.version.outputs.v }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sign the tag with an SSH key registered to the account as a
          # signing key, so GitHub shows it as Verified. Tagger email is the
          # account's private noreply address (keeps the real email private).
          install -m 600 /dev/null "$RUNNER_TEMP/sk"
          printf '%s\n' "$SSH_SIGNING_KEY" > "$RUNNER_TEMP/sk"
          git config user.name "kipavy"
          git config user.email "88386090+kipavy@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/sk"
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created and pushed signed tag $TAG"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  # The distribution channels below consume ONLY the published GitHub release and
  # its assets, but used to be `needs: [tag, release]` — so any failure anywhere in
  # release.yml skipped them. A plugin-manifest guard failing after the release was
  # already published took Homebrew, winget and the apt/yum repos out for v0.16.0
  # with no retry and no fallback trigger (issue #92). Gate them on the release
  # being published instead of on the whole workflow succeeding.
  #
  # `release-published` reads publish-release's output, falling back to the release
  # state on GitHub: a reusable workflow whose overall conclusion is failure is the
  # exact case that matters here, and it must not be able to leave this gate blank.
  release-published:
    needs: [tag, release]
    if: ${{ !cancelled() && needs.tag.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          REPORTED: ${{ needs.release.outputs.published }}
        run: |
          draft=$(gh release view "$TAG" -R "$REPO" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$REPORTED" = "true" ] || [ "$draft" = "false" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is published (publish-release said '$REPORTED', isDraft=$draft)."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $TAG is not published (publish-release said '$REPORTED', isDraft=$draft) — skipping the distribution channels."
          fi

  # Publish Homebrew cask + winget manifest once the release and its assets
  # exist. Called explicitly here rather than via `release: published`, which
  # never fires for a GITHUB_TOKEN-authored release (see publish-installers.yml).
  publish-installers:
    needs: [tag, release-published]
    if: ${{ !cancelled() && needs.release-published.outputs.ok == 'true' }}
    uses: ./.github/workflows/publish-installers.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  # Publish the apt/yum package repos to R2 once the release exists. Same
  # `release: published` gotcha as publish-installers — the token-authored
  # release never fires that event, so it's called explicitly here. The script
  # rebuilds statelessly from the last 5 releases, so it self-heals.
  publish-repo:
    needs: [tag, release-published]
    if: ${{ !cancelled() && needs.release-published.outputs.ok == 'true' }}
    uses: ./.github/workflows/publish-repo.yml
    secrets: inherit
